name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # every Monday: retrain + re-test on that day's live phishing
  workflow_dispatch:

jobs:
  test:
    name: unit tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  real-data:
    name: train on PhiUSIIL + live OpenPhish test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: data/phiusiil.csv
          key: phiusiil-v1
      - run: pip install -r requirements.txt
      - run: python -m sentinel train --quiet
      - run: python -m sentinel live
      - uses: actions/upload-artifact@v4
        with:
          name: model-and-reports
          path: |
            models/
            reports/
            README.md
