[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urlsentinel"
version = "1.0.0"
description = "Explainable phishing URL detection with a from-scratch NumPy neural network"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]
optional-dependencies = { full = ["scikit-learn>=1.3", "matplotlib>=3.7"], dev = ["pytest>=7", "ruff>=0.4"] }
keywords = ["security", "phishing", "machine-learning", "neural-network", "numpy", "explainable-ai"]

[project.scripts]
sentinel = "sentinel.cli:run"

[tool.setuptools]
packages = ["sentinel"]

[tool.setuptools.package-data]
sentinel = ["static/*.html"]

[tool.ruff]
line-length = 140
